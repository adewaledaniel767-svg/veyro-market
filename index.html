<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veyro Market</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      padding: 70px 6%;
      text-align: center;
      background: white;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      color: #555;
      margin-bottom: 25px;
    }

    .shop-btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 13px 25px;
      border-radius: 6px;
      text-decoration: none;
    }

    .products {
      padding: 45px 6%;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 3px 10pxrgba(0,0,0,0.08);
    }

    .product-image {
      height: 150px;
      background: #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .product h3 {
   font-size: 18px;
  margin: 10px 0;
    }
